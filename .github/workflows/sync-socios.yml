name: Sincronizar socios

# Lee la planilla de altas del club y actualiza src/data/socios.json.
# La credencial vive en el secret GOOGLE_SERVICE_ACCOUNT_JSON y nunca sale del runner.
# Del Sheet sale solo el nombre de cada socio: teléfonos, mails, DNI, direcciones
# y fechas de nacimiento están vetados en el script.

on:
  schedule:
    - cron: '0 9 * * 1' # todos los lunes a las 9 UTC (6 de la mañana en Argentina)
  workflow_dispatch:
    inputs:
      ocultar_nombres:
        description: 'Publicar solo el total, sin la lista de nombres'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-socios
  cancel-in-progress: false

jobs:
  sincronizar:
    name: Leer planilla y commitear
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Leer la planilla
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PUBLICAR_NOMBRES: ${{ inputs.ocultar_nombres && '0' || '1' }}
        run: node scripts/sync-socios.mjs

      - name: Commitear si cambió
        run: |
          if git diff --quiet -- src/data/socios.json; then
            echo "Sin cambios en el total de socios."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/socios.json
          git commit -m "Actualizar el total de socios desde la planilla del club"
          git push
