name: Sincronizar fotos

# Baja las fotos de la carpeta de Google Drive del club a src/assets/fotos/
# y regenera src/data/fotos.json (subcarpeta y fecha de cada foto, para el
# epígrafe). Es un espejo: lo que se borra en Drive se borra del sitio.
#
# Configuración:
#   - Variable del repo FOTOS_DRIVE_FOLDER: el link de la carpeta compartida.
#   - Credencial (opcional): sin ninguna, la carpeta tiene que ser pública
#     ("cualquiera con el enlace") y se lee por la vista embebida. Con el secret
#     GOOGLE_SERVICE_ACCOUNT_JSON (carpeta compartida como Lector con la service
#     account) o DRIVE_API_KEY se usa la Drive API formal.
# Mientras falte la variable, el script avisa y termina en verde.
#
# No tiene cron: se corre a mano. Tenía uno diario (10 UTC) y se sacó el
# 2026-08-10, porque la carpeta de Drive dejó de ser pública y el modo sin
# credencial devolvía 401 todos los días. Hoy la sincronización la hace Ariel
# desde su máquina, con un access token de Drive (ver CLAUDE.md). Si alguna vez
# se carga GOOGLE_SERVICE_ACCOUNT_JSON o DRIVE_API_KEY, vale la pena volver a
# poner el cron acá.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-fotos
  cancel-in-progress: false

jobs:
  sincronizar:
    name: Leer Drive y commitear
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # sharp (la conversión a webp) vive en devDependencies.
      - name: Instalar dependencias
        run: npm ci

      - name: Bajar las fotos
        env:
          FOTOS_DRIVE_FOLDER: ${{ vars.FOTOS_DRIVE_FOLDER }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
        run: node scripts/sync-fotos.mjs

      - name: Commitear si cambió
        run: |
          git add -A src/assets/fotos src/data/fotos.json

          if git diff --cached --quiet; then
            echo "Sin cambios en las fotos."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar las fotos de la galería desde Google Drive"
          git push
